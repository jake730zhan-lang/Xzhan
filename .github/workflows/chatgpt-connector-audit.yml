name: ChatGPT connector audit

on:
  pull_request:
    branches: [chatgpt-audit-base]
    types: [opened]

permissions: {}

jobs:
  connector-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Write harmless audit artifact
        shell: bash
        run: |
          printf 'Connector audit; attempt=%s\n' "$GITHUB_RUN_ATTEMPT" > connector-audit-result.txt
      - name: Controlled failure for two rerun API tests
        shell: bash
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" -lt 3 ]; then
            echo 'Expected test failure to verify rerun permissions.'
            exit 1
          fi
          echo 'Both rerun tests reached their final attempt.'
      - name: Upload audit proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: connector-audit-${{ github.run_attempt }}
          path: connector-audit-result.txt
          retention-days: 1
          if-no-files-found: error
